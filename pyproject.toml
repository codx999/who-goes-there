[project]
name = "trailcam"
version = "0.1.0"
description = "Who Goes There: camera-trap species classifier on Caltech Camera Traps (CCT20)"
requires-python = ">=3.12"
license = "MIT"
# Minimums are the oldest versions tests/test_dataset.py and tests/test_models.py (and
# tests/test_config.py for PyYAML, tests/test_attention.py for matplotlib) passed on (Python
# 3.12, NumPy 2), not the locked ones: pip on Kaggle then keeps the preinstalled CUDA torch (and
# timm, matplotlib) instead of replacing them.
dependencies = [
    "matplotlib>=3.8.4",
    "pillow>=10.1",
    "pyyaml>=6.0.1",
    "timm>=1.0.3",
    "torch>=2.3",
    "torchvision>=0.18",
]

# pip on Kaggle builds the package from the public repo (`pip install git+https://...`). The wheel
# holds the trailcam package alone; the sdist adds only the README and the licence, so tests,
# docs and anything untracked in a checkout never leave it. Kaggle's GPU image (Colab base of
# 2026-09-17) runs Python 3.13, torch 2.11, torchvision 0.26 and Pillow 11.3.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trailcam"]

[tool.hatch.build.targets.sdist]
only-include = ["trailcam", "README.md", "LICENSE"]

# gradio is the demo's alone (item 10.01): a group, not a runtime dependency, so the wheel's
# Requires-Dist and pip on Kaggle never see it, while `uv sync` installs it with dev.
# huggingface_hub is a direct dependency of scripts/deploy_space.py alone (item 11.01): its own
# group, so the wheel's Requires-Dist does not name it. The Space's requirements pin it since item
# 13.11, at the lock's version, as a requirement of timm (a phase-3 ConvNeXt), not for the deploy.
[tool.uv]
default-groups = ["dev", "demo", "deploy"]

[dependency-groups]
demo = [
    "gradio>=6.30.0",
]
deploy = [
    "huggingface-hub>=2.2.0",
]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

# Every platform but macOS (so CI's Linux) takes torch and torchvision from the CPU-only PyTorch
# index and never downloads the CUDA builds; the macOS wheels on PyPI are CPU-only already. These
# two tables are uv's alone: pip on Kaggle never reads them.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "trailcam",
    "scripts/guard_data.py",
    "scripts/kaggle_prepare_cct20.py",
    "scripts/kaggle_pack_cache.py",
    "scripts/deploy_space.py",
    "space/app.py",
]

# torchvision ships no type information (no py.typed); its names are typed Any. torch, timm and
# Pillow ship py.typed and need no override.
[[tool.mypy.overrides]]
module = ["torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
