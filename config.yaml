# Training configs (plan.md section 5), loaded and checked by trailcam/train/config.py.
#
# `common` holds the recipe every config shares; each config under `configs` lists its own fields
# and may override a common one. A config is `common` updated with its own block. Arm A and arm B
# differ only in `arm` (R25, plan.md section 6); tests/test_config.py checks that and the recipe
# values below (R31). Changing a value here changes a reported experiment: it needs the user's OK.
#
# Phase 2 (docs/phase2-plan.md, item 13.02): a config named p2_... is resnet18_arm_a with one
# change, which tests/test_config.py names per config; its runs go to docs/ledger-phase2.md, never
# docs/ledger.md. `input_size` is left out of the config hash at 224, and arm C's `paste_p` (item
# 13.04) while a config leaves it out, so the phase-1 hashes in docs/ledger.md are unchanged (a
# test pins them).
#
# Floats need a dot or YAML reads them as strings: 1.0e-4, not 1e-4 (the loader refuses a string).
# `fixture: true` is the dry run: train.py writes the synthetic fixture into a temporary directory
# and trains on it. Every other config reads the 512 px cache whose path train.py is given.

common:
  split_seed: 42          # the seed of the pinned split tests and the data card (item 3.04)
  run_seed: 0             # seeds 1 and 2 are per-run overrides (plan.md section 6)
  batch_size: 64
  input_size: 224         # train crop and eval centre crop; the eval resize keeps 256/224's margin
  weight_decay: 1.0e-2    # AdamW, decoupled
  scheduler: cosine       # cosine annealing after a linear warmup
  warmup_epochs: 1
  patience: 3             # early stopping on val macro-F1; the best checkpoint is restored
  mixed_precision: true   # on the GPU; a CPU run trains in float32
  num_workers: 4          # make_loaders on Kaggle
  pin_memory: true
  fixture: false

configs:
  # One epoch on two images per batch over the synthetic fixture, on the Mac (/dryrun). Random
  # weights, so it runs offline; no head-only epoch, so its one epoch trains the body too.
  dryrun:
    model: resnet18
    arm: B
    pretrained: false
    max_epochs: 1
    head_only_epochs: 0
    lr_body: 1.0e-4
    lr_head: 1.0e-3
    batch_size: 2
    num_workers: 0
    pin_memory: false
    fixture: true

  # From scratch: no pretrained body to protect, so body and head share the head's rate.
  small_cnn:
    model: small_cnn
    arm: A
    pretrained: false
    max_epochs: 15
    head_only_epochs: 0
    lr_body: 1.0e-3
    lr_head: 1.0e-3

  # The experiment (plan.md section 6): arm A the control, arm B box-guided crops.
  resnet18_arm_a:
    model: resnet18
    arm: A
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3

  resnet18_arm_b:
    model: resnet18
    arm: B
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3

  # Phase 2 (docs/phase2-plan.md section 6): screened in parallel on run seed 0 against
  # p2_baseline, each one change from resnet18_arm_a; tests/test_config.py checks that change.

  # resnet18_arm_a exactly, re-run at the phase-2 commit: the control every variant is paired with.
  p2_baseline:
    model: resnet18
    arm: A
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3

  # Step 1, arm C (item 13.04): the box of half the boxed train images pasted onto an empty frame
  # of another training camera, same day/night flag, then trained as arm A. The one change is the
  # arm, with arm C's own setting `paste_p`.
  p2_arm_c:
    model: resnet18
    arm: C
    paste_p: 0.5
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3

  # Step 1's pre-declared follow-up (item 13.08): p2_arm_c with half its paste probability, so
  # still one change (the arm, with its setting) from p2_baseline; judged by the same rule.
  p2_arm_c_p25:
    model: resnet18
    arm: C
    paste_p: 0.25
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3

  # Step 3: three head-only epochs inside the same 10, so the body trains 7.
  p2_head3:
    model: resnet18
    arm: A
    pretrained: true
    max_epochs: 10
    head_only_epochs: 3
    lr_body: 1.0e-4
    lr_head: 1.0e-3

  # Step 4: train crop 320; eval resize round(320 x 256 / 224) = 366, centre crop 320.
  p2_res320:
    model: resnet18
    arm: A
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3
    input_size: 320

  # Step 5: ResNet-50 with ImageNet-1k (V1) weights, the same recipe.
  p2_r50:
    model: resnet50
    arm: A
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3
