# Training configs (plan.md section 5), loaded and checked by trailcam/train/config.py.
#
# `common` holds the recipe every config shares; each config under `configs` lists its own fields
# and may override a common one. A config is `common` updated with its own block. Arm A and arm B
# differ only in `arm` (R25, plan.md section 6); tests/test_config.py checks that and the recipe
# values below (R31). Changing a value here changes a reported experiment: it needs the user's OK.
#
# Floats need a dot or YAML reads them as strings: 1.0e-4, not 1e-4 (the loader refuses a string).
# `fixture: true` is the dry run: train.py writes the synthetic fixture into a temporary directory
# and trains on it. Every other config reads the 512 px cache whose path train.py is given.
#
# Phase 2 (docs/phase2-plan.md): configs named `p2_...`; a phase-2 setting such as `paste_p` is
# left out by the phase-1 configs, so their config hashes stay those of docs/ledger.md.

common:
  split_seed: 42          # the seed of the pinned split tests and the data card (item 3.04)
  run_seed: 0             # seeds 1 and 2 are per-run overrides (plan.md section 6)
  batch_size: 64
  weight_decay: 1.0e-2    # AdamW, decoupled
  scheduler: cosine       # cosine annealing after a linear warmup
  warmup_epochs: 1
  patience: 3             # early stopping on val macro-F1; the best checkpoint is restored
  mixed_precision: true   # on the GPU; a CPU run trains in float32
  num_workers: 4          # make_loaders on Kaggle
  pin_memory: true
  fixture: false

configs:
  # One epoch on two images per batch over the synthetic fixture, on the Mac (/dryrun). Random
  # weights, so it runs offline; no head-only epoch, so its one epoch trains the body too.
  dryrun:
    model: resnet18
    arm: B
    pretrained: false
    max_epochs: 1
    head_only_epochs: 0
    lr_body: 1.0e-4
    lr_head: 1.0e-3
    batch_size: 2
    num_workers: 0
    pin_memory: false
    fixture: true

  # From scratch: no pretrained body to protect, so body and head share the head's rate.
  small_cnn:
    model: small_cnn
    arm: A
    pretrained: false
    max_epochs: 15
    head_only_epochs: 0
    lr_body: 1.0e-3
    lr_head: 1.0e-3

  # The experiment (plan.md section 6): arm A the control, arm B box-guided crops.
  resnet18_arm_a:
    model: resnet18
    arm: A
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3

  resnet18_arm_b:
    model: resnet18
    arm: B
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3

  # Phase 2, step 1 (docs/phase2-plan.md section 6): arm C pastes the box of half the boxed train
  # images onto an empty frame of another training camera, same day/night flag, then trains as
  # arm A. resnet18_arm_a's recipe with `arm: C` and `paste_p` alone (tests/test_config.py).
  p2_arm_c:
    model: resnet18
    arm: C
    paste_p: 0.5
    pretrained: true
    max_epochs: 10
    head_only_epochs: 1
    lr_body: 1.0e-4
    lr_head: 1.0e-3
